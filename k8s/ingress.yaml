# Public, gated only by sandpitd's keys, like wisp's *.sandbox.inevitable.fyi: each API at
# <api>.substrate.inevitable.fyi and its sandbox hosts under it (E2B's <port>-<id>.e2b.,
# Vercel's <subdomain>.vercel. routes, Daytona's <port>-<id>.daytona. previews). home-cloud's *.inevitable.fyi record already
# points here; the certificate is DNS-01.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandpit-e2b-tls
spec:
  secretName: sandpit-e2b-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - e2b.substrate.inevitable.fyi
    - "*.e2b.substrate.inevitable.fyi"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sandpit-e2b
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`e2b.substrate.inevitable.fyi`) || HostRegexp(`^[a-z0-9-]+\.e2b\.substrate\.inevitable\.fyi$`)
      kind: Rule
      services:
        - name: sandpitd
          port: 7901
  tls:
    secretName: sandpit-e2b-tls
---
