# substrate.inevitable.fyi: the static page, its two downloads and llms.txt, plus each API's
# /healthz on this origin, so the page's status lights need no CORS.
server {
  listen 8080;
  access_log off;
  root /srv/site;
  server_tokens off;

  types {
    text/html html;
    text/plain py mjs txt;
  }
  charset utf-8;
  add_header Cache-Control "public, max-age=300" always;
  add_header X-Content-Type-Options nosniff always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Straight to sandpitd's listeners in this namespace. Answers 502 when it doesn't. The
  # Sprites API's Host is set because that listener tells the API from the dashboard by it.
  location ~ ^/status/(sprites|e2b|vercel|daytona)$ {
    proxy_pass http://sandpitd.sandpit.svc.cluster.local:$status_port/healthz;
    proxy_set_header Host $1.substrate.inevitable.fyi;
    resolver kube-dns.kube-system.svc.cluster.local valid=60s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

map $uri $status_port {
  default 0;
  /status/sprites 7900;
  /status/e2b 7901;
  /status/vercel 7902;
  /status/daytona 7903;
}
