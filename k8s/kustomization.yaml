# sandpit-kube on Agent Substrate in home-cloud (docs/plans/kubernetes-backend.md, phase 1):
# the E2B API at e2b.substrate.inevitable.fyi, its sandboxes as Substrate actors on gVisor
# workers. Applied by arugula-salad/fleet (clusters/home/apps/sandpit.yaml). Substrate itself
# is home-cloud's platform/agent-substrate.
#
# The image digests here (sandpit-kube below, the guest in actortemplate.yaml) are pinned by
# .github/workflows/substrate-images.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandpit
resources:
  - namespace.yaml
  - workerpool.yaml
  - infisical.yaml
  - sandpit-kube.yaml
  - ingress.yaml
configMapGenerator:
  # A new guest image is a new file, so a new ConfigMap, a rolled Deployment, and a new
  # ActorTemplate (sandpit-kube names it after the file's hash).
  - name: sandpit-actortemplate
    files:
      - actortemplate.yaml
images:
  - name: sandpit-kube
    newName: ghcr.io/arugula-salad/sandpit-kube
    digest: sha256:0201f8008ebd2247ba85b5205f867b19783a89e9b43afd2c8ace9fb2e5addf97
