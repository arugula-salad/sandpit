# sandpitd --backend substrate in home-cloud (docs/plans/kubernetes-backend.md, phase 1):
# the E2B API at e2b.substrate.inevitable.fyi, its sandboxes as Substrate actors on gVisor
# workers. Applied by arugula-salad/fleet (clusters/home/apps/sandpit.yaml). Substrate itself
# is home-cloud's platform/agent-substrate.
#
# The image digests here (sandpit-kube below, which holds sandpitd, the guest in actortemplate.yaml) are pinned by
# .github/workflows/substrate-images.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandpit
resources:
  - namespace.yaml
  - workerpool.yaml
  - infisical.yaml
  - sandpitd.yaml
  - ingress.yaml
configMapGenerator:
  # A new guest image is a new file, so a new ConfigMap, a rolled Deployment, and a new
  # ActorTemplate (sandpitd names it after the file's hash).
  - name: sandpit-actortemplate
    files:
      - actortemplate.yaml
      - templates/sprites.yaml
      - templates/vercel.yaml
      - templates/daytona.yaml
images:
  - name: sandpit-kube
    newName: ghcr.io/arugula-salad/sandpit-kube
    digest: sha256:02ac7c8f7173700fb2aeea8c0d1021a15abe66b549191b81b4486b6c360ae60b
