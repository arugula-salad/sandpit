# The sprites API's guest (images/substrate-agent on its userland) as an ActorTemplate for
# Substrate v0.4.0. sandpitd makes it (--api-template sprites=...) as sprites-<hash of this file>.
# Its sandpit-agent listens on 2024 behind an upgrade, claimed on each sandbox's first
# resume. Snapshots go to home-cloud's Garage bucket agent-substrate. SYS_PTRACE is the agent's,
# to read other users' /proc/<pid>/fd and tell which session opened a port; sessions get the
# capabilities their privileges profile allows.
workerSelector:
  matchLabels:
    workload: sandpit-e2b
containers:
- name: agent
  image: ghcr.io/arugula-salad/sandpit-guest@sha256:dc487b50388449ca8fccbba408396592337d29eb9dca4e206bfc040a95f916ae
  securityContext:
    capabilities:
      add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, NET_BIND_SERVICE, NET_RAW, SETUID, SETGID, SETPCAP, SETFCAP, SYS_CHROOT, SYS_PTRACE, MKNOD]
resources:
  limits:
  - {name: cpu, quantity: "2"}
  - {name: memory, quantity: 1Gi}
snapshotConfig:
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: gs://agent-substrate/sandpit/
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
