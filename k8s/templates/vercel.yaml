# The vercel API's guest (images/substrate-agent on its userland) as an ActorTemplate for
# Substrate v0.4.0. sandpitd makes it (--api-template vercel=...) as vercel-<hash of this file>.
# Its sandpit-agent listens on 2024 behind an upgrade, claimed on each sandbox's first
# resume. Snapshots go to home-cloud's Garage bucket agent-substrate.
workerSelector:
  matchLabels:
    workload: sandpit-e2b
containers:
- name: agent
  image: ghcr.io/arugula-salad/sandpit-guest@sha256:22339761d725295fb43d21069095bebfce5e97ec4a38adea9ef9f77741ee0509
  securityContext:
    capabilities:
      add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, NET_BIND_SERVICE, NET_RAW, SETUID, SETGID, SETPCAP, SETFCAP, SYS_CHROOT, MKNOD]
resources:
  limits:
  - {name: cpu, quantity: "2"}
  - {name: memory, quantity: 1Gi}
snapshotConfig:
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: gs://agent-substrate/sandpit/
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
