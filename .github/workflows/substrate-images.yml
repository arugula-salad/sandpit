# Builds sandpit-kube and the E2B guest for the substrate engine, pushes them to
# ghcr.io/arugula-salad/{sandpit-kube,sandpit-e2b-guest} and pins both digests into k8s/,
# which is how Flux (arugula-salad/fleet) rolls home-cloud's in-cluster sandpit onto them.
# amd64 only: every home-cloud node is.
#
# Both packages must be public: Agent Substrate's atelet pulls the guest image with no
# credentials, and the sandpit namespace has no pull secret.
name: substrate-images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmd/sandpit-kube/**"
      - "substrate/**"
      - "e2b/**"
      - "engine/**"
      - "internal/store/**"
      - "images/e2b/**"
      - "images/substrate/**"
      - "images/sandpit-kube/**"
      - "scripts/build-envd.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/substrate-images.yml"
  push:
    branches: [main]
    paths:
      - "cmd/sandpit-kube/**"
      - "substrate/**"
      - "e2b/**"
      - "engine/**"
      - "internal/store/**"
      - "images/e2b/**"
      - "images/substrate/**"
      - "images/sandpit-kube/**"
      - "scripts/build-envd.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/substrate-images.yml"

concurrency:
  group: substrate-images-${{ github.ref }}
  cancel-in-progress: false

env:
  KUBE_IMAGE: ghcr.io/${{ github.repository_owner }}/sandpit-kube
  GUEST_IMAGE: ghcr.io/${{ github.repository_owner }}/sandpit-e2b-guest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The docker driver, so the guest's build sees the userland image the step before loaded.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build envd
        run: ./scripts/build-envd.sh

      # The guest is two builds, as in scripts/build-substrate-image.sh: the E2B userland,
      # then images/substrate on top of it.
      - name: Build the E2B userland
        uses: docker/build-push-action@v6
        with:
          context: images/e2b
          file: images/e2b/Containerfile
          platforms: linux/amd64
          tags: sandpit-e2b:ci
      - name: Build and push the guest
        id: guest
        uses: docker/build-push-action@v6
        with:
          context: images/substrate
          file: images/substrate/Containerfile
          platforms: linux/amd64
          build-args: USERLAND=sandpit-e2b:ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.GUEST_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push sandpit-kube
        id: kube
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/sandpit-kube/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.KUBE_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # The commit touches only k8s/, outside `paths`, so it doesn't trigger another build.
      - name: Pin the images
        if: github.event_name != 'pull_request'
        env:
          GUEST_DIGEST: ${{ steps.guest.outputs.digest }}
          KUBE_DIGEST: ${{ steps.kube.outputs.digest }}
        run: |
          sed -i -E "s#^(    digest: ).*#\1${KUBE_DIGEST}#" k8s/kustomization.yaml
          sed -i -E "s#(image: ${GUEST_IMAGE})@sha256:[0-9a-f]+#\1@${GUEST_DIGEST}#" k8s/actortemplate.yaml
          git diff --quiet && { echo "already pinned"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "deploy(sandpit-kube): pin images sha-${GITHUB_SHA::7}"
          git pull --rebase
          git push
